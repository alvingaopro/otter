[package]
name = "otter-desktop"
version = "0.6.14"
description = "Otter desktop: a thin client over otter-client."
edition = "2024"
publish = false

# Its own workspace: Tauri's dependency tree (WebKit on Linux) stays out of
# the main `cargo build` / `cargo test`.
[workspace]

[lib]
name = "otter_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
otter-core = { path = "../../../crates/core" }
otter-protocol = { path = "../../../crates/protocol" }
otter-client = { path = "../../../crates/client" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
png = "0.18"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

# Thin LTO with parallel codegen: ~2.4x faster release builds than fat LTO
# with one codegen unit, for a ~1 MB larger binary (D-022).
[profile.release]
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
