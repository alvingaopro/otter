[package]
name = "otterd"
description = "Otter host daemon."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "otterd"
path = "src/main.rs"

[dependencies]
url.workspace = true
base64.workspace = true
otter-core.workspace = true
otter-protocol.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
clap.workspace = true
libc.workspace = true
portable-pty.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network"] }
# Throwaway browser profiles (browser.rs).
tempfile.workspace = true

[dev-dependencies]
otter-client.workspace = true
