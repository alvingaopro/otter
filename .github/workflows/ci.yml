name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Daemon, CLI and crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # End-to-end tests drive a real tmux; the direnv test runs when direnv is present.
      - run: sudo apt-get update && sudo apt-get install -y tmux direnv openssh-server
      # Passwordless `ssh localhost` for the CLI's SSH transport test.
      - name: Enable ssh localhost
        run: |
          sudo systemctl start ssh || sudo service ssh start
          mkdir -p ~/.ssh && chmod 700 ~/.ssh && chmod go-w ~
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          ssh-keyscan -H localhost >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes localhost true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # A skipped SSH test is a failure here. The real-browser tests skip:
      # they have their own job (D-137).
      - run: cargo test --locked
        env:
          OTTER_E2E_REQUIRE_SSH: "1"
      # Show the SSH test's own output in the log.
      - run: cargo test --locked -p otter --test e2e ssh_host_normal_flow -- --nocapture
        env:
          OTTER_E2E_REQUIRE_SSH: "1"
      - run: python3 scripts/version.py current

  browser:
    name: Real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The end-to-end ones run tasks, so sessions, on a real tmux.
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Browser checks (D-046) on the runner's Chrome, which now and then
      # dies on its own there: a failure shows here, marked on the step,
      # and doesn't turn the PR's checks red (D-137).
      - run: >-
          cargo test --locked -p otterd --
          browser::tests
          a_browser_check_verifies_the_ui_with_evidence
          a_broken_ui_fails_verification
          a_preview_runs_as_a_session_on_one_port
        continue-on-error: true
        env:
          OTTER_TEST_BROWSER: "1"
          # Chrome's sandbox can't start where unprivileged user namespaces
          # are restricted.
          OTTER_BROWSER_NO_SANDBOX: "1"

  worker:
    name: Claude worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/claude-runtime
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/claude-runtime/package-lock.json
      # The tests drive a stand-in SDK: the bundled Claude Code (an optional,
      # per-platform package) isn't needed.
      - run: npm ci --omit=optional
      # Type-checks against the pinned SDK, then the protocol, mapping and
      # worker tests (no network, no credentials).
      - run: npm test
      # What `otter host install` and otterd ask it (D-060). Without the
      # optional Claude Code, it must say so and fail.
      - run: |
          out=$(node dist/main.js --check) && exit 1
          echo "$out"
          echo "$out" | grep -q '"protocol_version":1'
          echo "$out" | grep -q '"claude_code":false'

  desktop:
    name: Desktop app
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            .
      - run: npm ci
      # UI tests: navigation, feature view, contracts (simulated DOM).
      - run: npm test
      # Type-checks and bundles the UI; Tauri's build embeds dist/.
      - run: npm run build
      # The bundled otter/otterd (D-085): Tauri's build needs them to exist.
      - run: npm run sidecars
        env:
          TAURI_ENV_DEBUG: "true"
      - run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: apps/desktop/src-tauri
      - run: cargo test --locked
        working-directory: apps/desktop/src-tauri
