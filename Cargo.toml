[workspace]
resolver = "3"
members = ["crates/core", "crates/protocol", "crates/client", "crates/daemon", "crates/cli"]
# Built on its own (see its Cargo.toml).
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.6.15"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
otter-core = { path = "crates/core" }
otter-protocol = { path = "crates/protocol" }
otter-client = { path = "crates/client" }

anyhow = "1"
base64 = "0.22"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
libc = "0.2"
portable-pty = "0.9"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
